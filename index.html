<meta name="theme-color" content="#0b1220">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5fa;--bg2:#e4eaf5;--fg:#14213a;--mut:#5d6b86;--card:#fff;--card2:#f1f4fa;--line:rgba(20,33,58,.1);--ac:#e5a61f;--ac2:#f6c85a;--sea:#d3e4f4;--land:#c5cfdf;--g:#6a9bd8;--sh:0 8px 24px rgba(20,33,58,.1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--bg2:#13203a;--fg:#e9eef7;--mut:#93a0b8;--card:#152238;--card2:#1b2b47;--line:rgba(255,255,255,.09);--sea:#0e2036;--land:#26354e;--g:#4f86cc;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0b1220;--bg2:#13203a;--fg:#e9eef7;--mut:#93a0b8;--card:#152238;--card2:#1b2b47;--line:rgba(255,255,255,.09);--sea:#0e2036;--land:#26354e;--g:#4f86cc;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:radial-gradient(1100px 520px at 50% -8%,var(--bg2),var(--bg));-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:auto;padding:14px 16px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}#hl{width:38px;height:38px;border-radius:11px;box-shadow:var(--sh)}
h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:.16em}
#lvl{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}#lvl:empty{display:none}
.hr{display:flex;align-items:center;gap:10px}.n{font-size:.75rem;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
#pips{display:flex;gap:5px}#pips i{width:11px;height:11px;border-radius:50%;background:var(--line);border:1.5px solid var(--mut);opacity:.9;transition:all .3s}
#pips i.cur{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 35%,transparent);transform:scale(1.15)}#pips i.x{background:#e5484d;border-color:#e5484d}#pips i.ok{background:#2fb344;border-color:#2fb344}
button{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a1b00;cursor:pointer;transition:transform .12s,filter .2s,box-shadow .2s;box-shadow:0 4px 12px rgba(229,166,31,.25)}
button:hover{filter:brightness(1.06)}button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:2px}
#mb{padding:7px 12px;background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:none}
input:not([type=checkbox]):not([type=file]){font:inherit;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px}
#fw{display:flex;flex-direction:column;align-items:center;margin:16px 0 8px}
#flag{position:relative;width:min(360px,100%);height:210px;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh),0 0 0 6px color-mix(in srgb,var(--ac) 14%,transparent)}
#emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:210px;line-height:1;transform:scale(1.5);transition:filter .6s}
#cov{position:absolute;inset:0;display:flex}#cov i{flex:1;background:repeating-linear-gradient(135deg,var(--card),var(--card) 9px,var(--card2) 9px,var(--card2) 18px);transition:opacity .6s}#cov i.o{opacity:0}
#fp{width:min(360px,100%);height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}#fb{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#3ecf6a);transition:width .6s}
#ft{font-size:.74rem;color:var(--mut);margin-top:6px}
#hint{text-align:center;color:var(--mut);font-size:.82rem;margin:6px 0 12px}
.row{display:flex;gap:10px}.row input{flex:1;box-shadow:var(--sh)}.row button{padding:12px 22px}
#msg{min-height:1.4em;text-align:center;font-weight:600;margin:10px 0}
